seed: 7
device: cpu
run_dir: runs/smoke_v3
data_path: data/processed/post_tonal_smoke_v3.pt
vocab_path: data/processed/post_tonal_smoke_v3.vocab.json
generate_data: true
corpus:
  train_samples: 24
  val_samples: 4
  test_samples: 4
  min_measures: 4
  max_measures: 6
  min_voices: 2
  max_voices: 4
  export_musicxml: true
  musicxml_dir: data/generated/smoke_musicxml
model:
  hidden_size: 64
  layers: 2
  heads: 4
  dropout: 0.1
  max_seq_len: 256
training:
  epochs: 1
  batch_size: 4
  lr: 0.0005
  weight_decay: 0.0
  val_fraction: 0.2
  early_stopping_patience: 3
  fast_dev_run: false
  num_workers: 0
  sequence_mode: rotating
  validation_sequence_mode: all
  target_tokens_per_window: 96
  gradient_clipping: true
  gradient_clip_norm: 1.0
evaluation:
  max_batches: 4
  export_examples: 3
  generation_examples: 3
  constraint_metric_samples: 4
  model_generation: true
  constraint_guided_decoding: true
  constraint_guided_attempts: 2
  max_new_tokens: 128
  max_new_tokens_per_measure: 24
  max_new_tokens_cap: 256
  grammar_constrained_decoding: true
