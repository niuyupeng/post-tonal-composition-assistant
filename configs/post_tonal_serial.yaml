seed: 44
run_dir: runs/serial
data_path: data/processed/post_tonal_serial.pt
vocab_path: data/processed/post_tonal_serial.vocab.json
generate_data: true
corpus:
  num_samples: 1000
  min_measures: 4
  max_measures: 16
  min_voices: 2
  max_voices: 8
  export_musicxml: false
  musicxml_dir: data/generated/serial_musicxml
  focus: serial
model:
  hidden_size: 256
  layers: 4
  heads: 4
  dropout: 0.1
  max_seq_len: 256
training:
  epochs: 20
  batch_size: 16
  lr: 0.0003
  weight_decay: 0.01
  val_fraction: 0.1
  early_stopping_patience: 5
  fast_dev_run: false
  num_workers: 0
evaluation:
  max_batches: null
  export_examples: 8
