experiment_name: rule_baseline
seed: 42
device: cpu
run_dir: runs/rule_baseline
data_path: data/processed/project2_rule_baseline.pt
vocab_path: data/processed/project2_rule_baseline.vocab.json
generate_data: true
corpus:
  train_samples: 20000
  val_samples: 2000
  test_samples: 2000
  min_measures: 4
  max_measures: 16
  min_voices: 2
  max_voices: 8
  export_musicxml: false
  musicxml_dir: data/generated/rule_baseline_musicxml
model:
  hidden_size: 384
  layers: 6
  heads: 6
  dropout: 0.1
  max_seq_len: 256
training:
  epochs: 0
  batch_size: 16
  lr: 0.0003
  weight_decay: 0.01
  val_fraction: 0.1
  early_stopping_patience: 10
  fast_dev_run: false
  fp16: false
  num_workers: 0
evaluation:
  split: test
  max_batches: null
  export_examples: 20
  generation_examples: 20
  constraint_metric_samples: 2000
  model_generation: false
