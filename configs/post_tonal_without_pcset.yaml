experiment_name: without_pcset_constraints
seed: 42
device: auto
condition_ablation: no_pcset
run_dir: runs/v3/without_pcset_constraints
data_path: data/processed/project2_v3_main.pt
vocab_path: data/processed/project2_v3_main.vocab.json
generate_data: false
corpus:
  train_samples: 20000
  val_samples: 2000
  test_samples: 2000
  min_measures: 4
  max_measures: 16
  min_voices: 2
  max_voices: 8
  export_musicxml: false
  musicxml_dir: data/generated/without_pcset_musicxml
model:
  hidden_size: 384
  layers: 6
  heads: 6
  dropout: 0.1
  max_seq_len: 256
training:
  epochs: 60
  batch_size: 16
  lr: 0.0003
  weight_decay: 0.01
  val_fraction: 0.1
  early_stopping_patience: 10
  fast_dev_run: false
  fp16: true
  num_workers: 0
  sequence_mode: coverage_cycle
  validation_sequence_mode: all
  target_tokens_per_window: 128
  coverage_cycle_epochs: 10
  gradient_clipping: true
  gradient_clip_norm: 1.0
evaluation:
  split: test
  max_batches: null
  export_examples: 20
  generation_examples: 20
  constraint_metric_samples: 2000
  model_generation: true
  constraint_guided_decoding: false
  constraint_guided_attempts: 1
  max_new_tokens: 224
  max_new_tokens_per_measure: 32
  max_new_tokens_cap: 768
  grammar_constrained_decoding: true
