[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "post-tonal-assistant"
version = "0.1.0"
description = "Neural-symbolic post-tonal composition assistant with pc-set, serial, and rhythmic-profile constraints"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Jiayu Liu" },
  { name = "Yupeng Niu" },
]
keywords = [
  "music generation",
  "neural-symbolic",
  "post-tonal music",
  "MusicXML",
  "pitch-class sets",
  "serialism",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "music21>=9.1",
  "torch>=2.1",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.urls]
Repository = "https://github.com/niuyupeng/post-tonal-composition-assistant"
Issues = "https://github.com/niuyupeng/post-tonal-composition-assistant/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
